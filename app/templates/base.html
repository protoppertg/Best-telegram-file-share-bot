<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepCore Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex">
    <aside class="w-64 glass border-r border-gray-200/50 min-h-screen flex flex-col fixed">
        <div class="p-6 text-xl font-bold text-gray-900 border-b border-gray-200/50">📚 PrepCore</div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="/admin/" class="flex items-center space-x-3 py-2.5 px-4 rounded-xl transition {{ 'bg-blue-500 text-white shadow-sm' if active == 'dashboard' else 'text-gray-600 hover:bg-gray-200/50' }}">
                <i class="fas fa-tachometer-alt w-5"></i> <span>Dashboard</span>
            </a>
            <a href="/admin/documents" class="flex items-center space-x-3 py-2.5 px-4 rounded-xl transition {{ 'bg-blue-500 text-white shadow-sm' if active == 'documents' else 'text-gray-600 hover:bg-gray-200/50' }}">
                <i class="fas fa-file-pdf w-5"></i> <span>Documents</span>
            </a>
            <a href="/admin/users" class="flex items-center space-x-3 py-2.5 px-4 rounded-xl transition {{ 'bg-blue-500 text-white shadow-sm' if active == 'users' else 'text-gray-600 hover:bg-gray-200/50' }}">
                <i class="fas fa-users w-5"></i> <span>Users</span>
            </a>
            <a href="/admin/broadcast" class="flex items-center space-x-3 py-2.5 px-4 rounded-xl transition {{ 'bg-blue-500 text-white shadow-sm' if active == 'broadcast' else 'text-gray-600 hover:bg-gray-200/50' }}">
                <i class="fas fa-bullhorn w-5"></i> <span>Broadcast</span>
            </a>
            <a href="/admin/settings" class="flex items-center space-x-3 py-2.5 px-4 rounded-xl transition {{ 'bg-blue-500 text-white shadow-sm' if active == 'settings' else 'text-gray-600 hover:bg-gray-200/50' }}">
                <i class="fas fa-cog w-5"></i> <span>Settings</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200/50">
            <a href="/admin/logout" class="flex items-center space-x-3 py-2.5 px-4 rounded-xl text-red-500 hover:bg-red-50 transition">
                <i class="fas fa-sign-out-alt w-5"></i> <span>Logout</span>
            </a>
        </div>
    </aside>
    <main class="flex-1 p-10 overflow-y-auto ml-64">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
