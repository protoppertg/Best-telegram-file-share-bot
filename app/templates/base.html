<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepCore Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 flex">
    <aside class="w-64 bg-gray-900 text-gray-100 min-h-screen flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-gray-700">📚 PrepCore</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="/admin/" class="block py-2.5 px-4 rounded transition {{ 'bg-blue-600' if active == 'dashboard' else 'hover:bg-gray-700' }}"><i class="fas fa-tachometer-alt mr-2"></i> Dashboard</a>
            <a href="/admin/documents" class="block py-2.5 px-4 rounded transition {{ 'bg-blue-600' if active == 'documents' else 'hover:bg-gray-700' }}"><i class="fas fa-file-pdf mr-2"></i> Documents</a>
            <a href="/admin/users" class="block py-2.5 px-4 rounded transition {{ 'bg-blue-600' if active == 'users' else 'hover:bg-gray-700' }}"><i class="fas fa-users mr-2"></i> Users</a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <a href="/admin/logout" class="block py-2.5 px-4 rounded hover:bg-red-600 transition text-red-300"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
        </div>
    </aside>
    <main class="flex-1 p-10 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
