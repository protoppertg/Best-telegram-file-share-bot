{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-8">
    <div>
        <h1 class="text-3xl font-bold text-gray-900">Edit Document</h1>
        <p class="text-gray-500 mt-1">Update file metadata.</p>
    </div>
    <a href="/admin/documents" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-xl hover:bg-gray-200 transition">Back to List</a>
</div>

<div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-3xl">
    <form method="POST" action="/admin/documents/edit/{{ doc.id }}" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">File Name</label>
                <input type="text" name="file_name" value="{{ doc.file_name }}" required class="w-full border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Subject</label>
                <input type="text" name="subject" value="{{ doc.subject or '' }}" class="w-full border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Category</label>
                <input type="text" name="category" value="{{ doc.category or '' }}" class="w-full border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Class</label>
                <input type="text" name="class_name" value="{{ doc.class_name or '' }}" class="w-full border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Year</label>
                <input type="number" name="year" value="{{ doc.year or '' }}" class="w-full border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Keywords (comma separated)</label>
            <input type="text" name="keywords" value="{{ doc.keywords|join(', ') }}" class="w-full border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
            <textarea name="description" rows="3" class="w-full border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">{{ doc.description or '' }}</textarea>
        </div>
        <button type="submit" class="bg-blue-500 text-white px-8 py-3 rounded-xl hover:bg-blue-600 transition shadow-sm font-medium">Update Document</button>
    </form>
</div>
{% endblock %}
