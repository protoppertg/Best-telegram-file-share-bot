{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Edit Document</h1>
    <a href="/admin/documents" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Back to List</a>
</div>

<div class="bg-white p-6 rounded-lg shadow max-w-2xl">
    <form method="POST" action="/admin/documents/edit/{{ doc.id }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">File Name</label>
                <input type="text" name="file_name" value="{{ doc.file_name }}" required class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Subject</label>
                <input type="text" name="subject" value="{{ doc.subject or '' }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Category</label>
                <input type="text" name="category" value="{{ doc.category or '' }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">University</label>
                <input type="text" name="university" value="{{ doc.university or '' }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Semester</label>
                <input type="text" name="semester" value="{{ doc.semester or '' }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Year</label>
                <input type="number" name="year" value="{{ doc.year or '' }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Keywords (comma separated)</label>
            <input type="text" name="keywords" value="{{ doc.keywords|join(', ') }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
            <textarea name="description" rows="3" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">{{ doc.description or '' }}</textarea>
        </div>
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Update Document</button>
    </form>
</div>
{% endblock %}
