<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl text-white font-bold mb-6 text-center">📚 PrepCore Admin</h1>
        {% if error %}
        <div class="bg-red-600 text-white p-3 rounded mb-4 text-sm text-center">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/admin/login">
            <div class="mb-4">
                <label class="block text-gray-400 mb-2">Password</label>
                <input type="password" name="password" required class="w-full bg-gray-700 text-white p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition">Login</button>
        </form>
    </div>
</body>
</html>
