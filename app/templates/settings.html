{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Settings</h1>
</div>

<div class="bg-white p-6 rounded-lg shadow max-w-md mb-6">
    <h2 class="text-xl font-bold mb-4">Bot Features</h2>
    <form method="POST" action="/admin/settings">
        <div class="flex items-center mb-4">
            <label class="inline-flex items-center cursor-pointer">
                <input type="checkbox" name="search_enabled" class="sr-only peer" {% if search_enabled %}checked{% endif %}>
                <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            </label>
            <span class="ms-3 text-sm font-medium text-gray-900">Enable Search Feature</span>
        </div>
        <p class="text-gray-500 text-sm mb-4">If turned off, users will not be able to search for files.</p>
        
        <hr class="my-6 border-gray-200">

        <h2 class="text-xl font-bold mb-4">Force Sub Settings</h2>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Channel ID (e.g., -1001234567890)</label>
            <input type="text" name="force_sub_channel_id" value="{{ fs_id }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Invite Link (e.g., https://t.me/+abc)</label>
            <input type="text" name="force_sub_invite_link" value="{{ fs_link }}" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <p class="text-gray-500 text-sm mb-4">Leave blank to disable Force Sub.</p>

        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Settings</button>
    </form>
</div>
{% endblock %}
